name: Regenerar feed RSS

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "sitemap.xml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed-rss
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: el script usa git log como último recurso para la fecha.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar feeds
        run: python3 tools/generar_feed.py

      - name: Commit si cambió algún feed
        run: |
          if git status --porcelain -- 'feed*.xml' | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- 'feed*.xml'
            git commit -m "chore: regenerar feed RSS"
            git push
          else
            echo "Los feeds no cambiaron."
          fi
