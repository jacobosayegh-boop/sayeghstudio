<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<title>pin-01-presupuesto</title>
<style>
  @font-face { font-family: 'Playfair Display'; src: url('../fonts/playfair-display-latin.woff2') format('woff2'); font-weight: 400 900; font-style: normal; }
  @font-face { font-family: 'Playfair Display'; src: url('../fonts/playfair-display-latin-italic.woff2') format('woff2'); font-weight: 400 900; font-style: italic; }
  :root {
    --carbon: #1A1A1A; --galeria: #FAFAFA; --concreto: #8A8D8F;
    --travertino: #D1C7B3; --dorado: #E5B962;
    --titulo: 'Helvetica Now Display', 'Neue Haas Grotesk Display Pro', 'Inter Display', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --cuerpo: 'Playfair Display', Georgia, 'Times New Roman', serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1000px; height: 1500px; overflow: hidden; background: var(--carbon); }
  .pin { position: relative; width: 1000px; height: 1500px; overflow: hidden; }
  .pin.claro { background: var(--galeria); color: var(--carbon); }
  .pin.oscuro { background: var(--carbon); color: var(--galeria); }

  /* Imagen */
  .media { position: absolute; left: 0; top: 0; width: 1000px; height: 1500px; overflow: hidden; display: flex; gap: 6px; }
  .media .foto { flex: 1; height: 100%; background-size: cover; background-repeat: no-repeat; position: relative; }
  .media::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 230px; z-index: 2;
    background: linear-gradient(180deg, rgba(26,26,26,.6) 0%, rgba(26,26,26,0) 100%); }
  .full .media::after { content: ''; position: absolute; inset: auto 0 0 0; height: 1000px; z-index: 2;
    background: linear-gradient(180deg, rgba(26,26,26,0) 0%, rgba(26,26,26,.80) 40%, rgba(26,26,26,.95) 72%, #1A1A1A 100%); }
  .etiqueta { position: absolute; left: 28px; bottom: 28px; z-index: 3; font: 500 20px/1 var(--titulo);
    letter-spacing: .14em; text-transform: uppercase; color: var(--galeria);
    background: rgba(26,26,26,.72); padding: 12px 16px; }

  .logo { position: absolute; left: 72px; top: 64px; width: 250px; z-index: 4; }
  .render { position: absolute; right: 28px; bottom: 28px; z-index: 4; font: 500 24px/1 var(--titulo);
    letter-spacing: .04em; color: var(--galeria); background: rgba(26,26,26,.72); padding: 12px 18px; }
  .credito { position: absolute; right: 72px; top: 72px; z-index: 4; font: italic 400 23px/1.25 var(--cuerpo);
    color: rgba(250,250,250,.9); text-align: right; }

  /* Texto */
  .texto { position: absolute; left: 72px; right: 72px; top: 900px; z-index: 5; }
  .kicker { font: 600 22px/1 var(--titulo); letter-spacing: .22em; text-transform: uppercase; margin-bottom: 30px; }
  .claro .kicker { color: #6E7173; }
  .oscuro .kicker { color: var(--dorado); }
  h1 { font: 500 84px/1.03 var(--titulo); letter-spacing: -0.025em; margin-bottom: 32px; }
  .apoyo { font: 400 32px/1.4 var(--cuerpo); max-width: 830px; }
  .claro .apoyo { color: #3A3A3A; }
  .oscuro .apoyo { color: rgba(250,250,250,.86); }

  /* Cinta de llamada a la acción */
  .cinta { position: absolute; left: 0; right: 0; bottom: 0; height: 132px; z-index: 6; background: var(--travertino);
    color: var(--carbon); display: flex; align-items: center; padding: 0 72px; gap: 22px; }
  .cinta .accion { font: 600 31px/1 var(--titulo); white-space: nowrap; }
  .cinta .sep { width: 8px; height: 8px; border-radius: 50%; background: var(--carbon); flex: none; }
  .cinta .url { font: 400 31px/1 var(--titulo); white-space: nowrap; }
  .cinta .flecha { margin-left: auto; font: 400 40px/1 var(--titulo); }
</style>
</head>
<body>
<div class="pin oscuro full">
  <div class="media"><div class="foto" style="background-image:url('../../../assets/images/projects/nuvana.jpg');background-position:center 30%"></div></div>
  <img class="logo" src="../logos/sayegh-principal-negativo.svg" alt="Sayegh Studio">
  <span class="credito">Nuvana, Interlomas</span>
  <div class="texto">
    <div class="kicker">Ingeniería financiera</div>
    <h1>El precio se firma antes de excavar</h1>
    <p class="apoyo">Precios unitarios inquebrantables, auditados antes de mover la primera piedra.</p>
  </div>
  <div class="cinta">
    <span class="accion">Auditoría de Viabilidad</span><span class="sep"></span><span class="url">sayeghstudio.com/auditoria</span>
    <span class="flecha">&rarr;</span>
  </div>
</div>
</body>
</html>
