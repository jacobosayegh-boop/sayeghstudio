<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<title>zona-bosque-real-01</title>
<style>
  @font-face { font-family: 'Playfair Display'; src: url('../../pines_conversion/fonts/playfair-display-latin.woff2') format('woff2'); font-weight: 400 900; font-style: normal; }
  @font-face { font-family: 'Playfair Display'; src: url('../../pines_conversion/fonts/playfair-display-latin-italic.woff2') format('woff2'); font-weight: 400 900; font-style: italic; }
  :root {
    --carbon: #1A1A1A; --galeria: #FAFAFA; --concreto: #8A8D8F;
    --travertino: #D1C7B3; --dorado: #E5B962;
    --titulo: 'Helvetica Now Display', 'Neue Haas Grotesk Display Pro', 'Inter Display', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --cuerpo: 'Playfair Display', Georgia, 'Times New Roman', serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1000px; height: 1500px; overflow: hidden; background: #1A1A1A; }
  .pin { position: relative; width: 1000px; height: 1500px; overflow: hidden; }
  .pin.claro { background: var(--galeria); color: var(--carbon); }
  .pin.oscuro { background: var(--carbon); color: var(--galeria); }
  .pin.capa { background: transparent; color: var(--galeria); }

  .media { position: absolute; left: 0; top: 0; width: 1000px; height: 920px; overflow: hidden; display: flex; gap: 6px; }
  .media .foto { flex: 1; height: 100%; background-repeat: no-repeat; position: relative; }
  .media::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 230px; z-index: 2;
    background: linear-gradient(180deg, rgba(26,26,26,.6) 0%, rgba(26,26,26,0) 100%); }
  .full .media::after, .capa .media::after { content: ''; position: absolute; inset: auto 0 0 0; height: 900px; z-index: 2;
    background: linear-gradient(180deg, rgba(26,26,26,0) 0%, rgba(26,26,26,.72) 42%, rgba(26,26,26,.92) 75%, rgba(26,26,26,.96) 100%); }
  .etiqueta { position: absolute; left: 28px; bottom: 28px; z-index: 3; font: 500 20px/1 var(--titulo);
    letter-spacing: .14em; text-transform: uppercase; color: var(--galeria);
    background: rgba(26,26,26,.72); padding: 12px 16px; }

  .logo { position: absolute; left: 64px; top: 60px; width: 240px; z-index: 4; }
  .serie { position: absolute; right: 64px; top: 64px; z-index: 4; font: 600 22px/1 var(--titulo); letter-spacing: .16em;
    color: var(--galeria); border: 1.5px solid rgba(250,250,250,.75); padding: 10px 14px; }
  .render { position: absolute; right: 24px; bottom: 600px; z-index: 4; max-width: 470px; text-align: right;
    font: 500 17px/1.3 var(--titulo); letter-spacing: .02em; color: var(--galeria);
    background: rgba(26,26,26,.74); padding: 9px 14px; }
  .credito { position: absolute; right: 64px; top: 72px; z-index: 4; font: italic 400 23px/1.25 var(--cuerpo);
    color: rgba(250,250,250,.9); text-align: right; }

  .texto { position: absolute; left: 64px; right: 64px; top: 978px; z-index: 5; }
  .kicker { font: 600 22px/1 var(--titulo); letter-spacing: .22em; text-transform: uppercase; margin-bottom: 26px; }
  .claro .kicker { color: #6E7173; }
  .oscuro .kicker, .capa .kicker { color: var(--dorado); }
  h1 { font: 500 78px/1.04 var(--titulo); letter-spacing: -0.025em; margin-bottom: 28px; }
  .apoyo { font: 400 34px/1.38 var(--cuerpo); max-width: 870px; }
  .claro .apoyo { color: #3A3A3A; }
  .oscuro .apoyo, .capa .apoyo { color: rgba(250,250,250,.88); }

  .cinta { position: absolute; left: 0; right: 0; bottom: 0; height: 124px; z-index: 6; background: var(--travertino);
    color: var(--carbon); display: flex; align-items: center; padding: 0 64px; gap: 22px; }
  .cinta .accion { font: 600 30px/1 var(--titulo); white-space: nowrap; }
  .cinta .sep { width: 8px; height: 8px; border-radius: 50%; background: var(--carbon); flex: none; }
  .cinta .url { font: 400 30px/1 var(--titulo); white-space: nowrap; }
  .cinta .flecha { margin-left: auto; font: 400 40px/1 var(--titulo); }
</style>
</head>
<body>
<div class="pin oscuro split">
  <div class="media"><div class="foto" style="background-image:url('../../../assets/images/zonas/bosque-real-terraza-vista-golf-1600.jpg');background-position:50% center;background-size:cover"></div></div>
  <img class="logo" src="../../pines_conversion/logos/sayegh-principal-negativo.svg" alt="Sayegh Studio">
  
  <span class="render">Render conceptual de Sayegh Studio. No corresponde a una obra entregada.</span>
  <div class="texto">
    <div class="kicker">Bosque Real · Huixquilucan</div>
    <h1>La vista se decide en el corte</h1>
    <p class="apoyo">Niveles, contención y orientación resueltos antes del primer plano.</p>
  </div>
  <div class="cinta">
    <span class="accion">Auditoría de Viabilidad</span><span class="sep"></span><span class="url">sayeghstudio.com/auditoria</span>
    <span class="flecha">&rarr;</span>
  </div>
</div>
</body>
</html>
